<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#10151d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e08f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e08f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00e08f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- grid pattern, terminal aesthetic -->
  <g stroke="#1a2030" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
  </g>

  <!-- candlestick motif, right side -->
  <g transform="translate(880,60)" stroke-linecap="round">
    <line x1="20" y1="10" x2="20" y2="150" stroke="#232b38" stroke-width="1"/>
    <rect x="10" y="40" width="20" height="55" fill="#00e08f"/>
    <line x1="70" y1="30" x2="70" y2="170" stroke="#232b38" stroke-width="1"/>
    <rect x="60" y="60" width="20" height="35" fill="#ff4d6d"/>
    <line x1="120" y1="0" x2="120" y2="140" stroke="#232b38" stroke-width="1"/>
    <rect x="110" y="20" width="20" height="70" fill="#00e08f"/>
    <line x1="170" y1="20" x2="170" y2="160" stroke="#232b38" stroke-width="1"/>
    <rect x="160" y="50" width="20" height="60" fill="#00e08f"/>
    <line x1="220" y1="40" x2="220" y2="180" stroke="#232b38" stroke-width="1"/>
    <rect x="210" y="70" width="20" height="40" fill="#ff4d6d"/>
  </g>

  <rect x="0" y="130" width="1200" height="2" fill="url(#glow)"/>

  <!-- mark -->
  <rect x="60" y="90" width="52" height="52" fill="#00e08f"/>
  <text x="86" y="126" font-family="JetBrains Mono, Consolas, monospace" font-size="22" font-weight="700" fill="#06140e" text-anchor="middle">CB</text>

  <text x="130" y="118" font-family="JetBrains Mono, Consolas, monospace" font-size="42" font-weight="700" fill="#e4e9f2" letter-spacing="1">CRYPTO.BOT</text>
  <text x="132" y="148" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#8b96a8">Event-driven multi-agent trading engine for Binance — async Python core, live dashboard</text>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="12" letter-spacing="1">
    <rect x="60" y="180" width="140" height="26" fill="none" stroke="#232b38"/>
    <text x="130" y="197" fill="#8b96a8" text-anchor="middle">MULTI-AGENT</text>

    <rect x="212" y="180" width="150" height="26" fill="none" stroke="#232b38"/>
    <text x="287" y="197" fill="#8b96a8" text-anchor="middle">EVENT-DRIVEN</text>

    <rect x="374" y="180" width="120" height="26" fill="none" stroke="#232b38"/>
    <text x="434" y="197" fill="#8b96a8" text-anchor="middle">ASYNC CORE</text>

    <rect x="506" y="180" width="150" height="26" fill="#00e08f1a" stroke="#00e08f"/>
    <text x="581" y="197" fill="#00e08f" text-anchor="middle">SAFETY-GATED LIVE</text>
  </g>
</svg>
