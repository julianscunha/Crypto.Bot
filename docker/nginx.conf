server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: no client-side router today (App.jsx switches
    # pages via local state, not a URL), but this keeps a direct
    # refresh/deep link safe either way instead of a raw 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite's build -- safe to
    # cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
