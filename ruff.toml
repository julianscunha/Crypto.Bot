[lint]
# Conjunto estável clássico do ruff (erros de sintaxe/lógica reais).
# Fixado explicitamente porque o conjunto "default" já variou entre
# versões do ruff (0.15 vs 0.16) e sem isso o lint do CI fica não
# determinístico dependendo de qual versão o pip instalar.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# apps/api/main.py organiza imports por seção de feature (comentário em
# apps/api/main.py:701-707 explica o motivo) -- E402 é esperado, não um bug.
"apps/api/main.py" = ["E402"]
